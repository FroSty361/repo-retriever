{% extends "base.html" %}

{% block stylesheets %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/file-view-dark.css') }}">

{% endblock %}

{% block title %} RepoRetriever File - {{ file_name }} {% endblock %}

{% block header %}

<h1 id="title">File {{ file_path }}</h1>

{% endblock %}

{% block content %}

<div class="code-container">
  <div class="code-header">
    <span class="file-name">{{ file_path }}</span>
  </div>
  <pre>
      <code>
          {{ file_content | safe }}
      </code>
  </pre>
</div>
{% endblock %}
