{% extends "base.html" %}

{% block stylesheets %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/result-dark.css') }}">

{% endblock %}

{% block title %} RepoRetriever Result - {{ repo_name }} {% endblock %}

{% block header %}

<h1 id="title">Results From {{ repo_name }}</h1>

{% endblock %}

{% block content %}
<div id="directoryTreeContainer">
  <ul id="directoryTree">
    {{ repo | safe }}
  </ul>
</div>

{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/repo-tree.js') }}"></script>

{% endblock %}
